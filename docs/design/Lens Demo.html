@media(max-width:520px){.header{grid-template-columns:max-content 1fr max-content}.header.entry{grid-template-columns:1fr auto 1fr}.wordmark{justify-self:center}.wordmark svg{height:27px}.nav .icon{width:31px}.connection-actions{gap:5px}
}

.filter-popup{position:fixed;inset:auto;margin:0;width:min(310px,calc(100vw - 24px));max-height:min(365px,calc(100dvh - 24px));padding:13px;border-radius:15px;box-shadow:0 10px 28px #0006;overscroll-behavior:contain}
.filter-popup::backdrop{background:transparent;pointer-events:none}
.filter-popup h2{font-size:19px}.filter-popup .popup-head{margin-bottom:9px}.filter-popup .popup-form{gap:10px}
.filter-popup .popup-head .icon{width:30px;min-height:30px}.filter-popup .popup-head .line-icon{width:16px;height:16px}
.filter-popup .post-options{max-height:120px}.filter-popup .popup-actions{margin-top:1px}
.filter-popup:popover-open{animation:filter-enter .16s ease-out both;transform-origin:top right}
.screen-enter{animation:screen-enter .2s ease-out both}
.reply-enter{animation:reply-enter .25s cubic-bezier(.2,.7,.3,1) both}
.analytics-grid .bars i{transform-origin:bottom;animation:metric-grow .32s ease-out both}
.analytics-grid .bars i:nth-child(2n){animation-delay:.035s}
@keyframes filter-enter{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
@keyframes screen-enter{from{opacity:.78;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes reply-enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes metric-grow{from{transform:scaleY(.15);opacity:.36}to{transform:scaleY(1);opacity:.85}}
@media(prefers-reduced-motion:reduce){.filter-popup:popover-open,.screen-enter,.reply-enter,.analytics-grid .bars i{animation:none}}

<script>
'use strict';
const STORAGE_KEY = 'lens-founder-demo-v2';
const PROVIDERS = ['Canva', 'Sculptex', 'LinkedIn'];
const QUESTIONS = [
  ['product', 'What does your company do?'],
  ['audience', 'Who do you want to reach?'],
  ['goal', 'What do you want your posts to achieve?'],

  ['voice', 'How should your posts sound? You can also mention topics to avoid.']

const SOURCE = 'https://arclight.events/event/creator-economy-hack-powered-by-you-com-1b12ws';
const INITIAL = {brand:null, onboarding:null, connections:{}, posts:[], journal:[], brainstorm:[], proposal:null, next:1};
function loadState() {
  try {return {...structuredClone(INITIAL),...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')};}
  catch {return structuredClone(INITIAL);}
}
let state = loadState();
delete state.auto;
delete state.onboardingRevision;
delete state.restartOnboarding;
let view = state.onboarding ? 'onboard' : state.brand ? 'review' : 'entry';
let revising = false;
let revisionError = '';

function icon(name) {

function save() {
  try {localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
  catch {notify('This session is active. Browser storage is unavailable.');}
}
function esc(value = '') {
  return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}
function notify(message) {
  clearTimeout(timer);
  notice.textContent = message;
  notice.hidden = false;
  timer = setTimeout(()=>{notice.hidden = true;},4700);
}
function go(next) {
  view = next;

  revising = false;
  revisionError = '';
  drag = null;
  render();
  main.firstElementChild?.classList.add('screen-enter');

function entryPage() {

function scanPage() {
  const domain = esc(state.onboarding.name);
  return `<section class="scan-page" aria-labelledby="scan-title">
    <div class="scan-stage" aria-hidden="true">
      <span class="scan-token behind" style="--x:15%;--y:61%;--delay:-.3s">/about</span>

function chatTurn(role,content) {

function chatComposer(id,placeholder) {

function chatWorkspace(label,logLabel,thread,footer) {

function connectionRows() {
  return `<div class="connections">${PROVIDERS.map(provider=>{
    const connected = Boolean(state.connections[provider]);
    const status = connected ? (provider==='LinkedIn'?'Connected':'Connected in demo') : 'Disconnected';
    return `<div class="connection"><div><strong>${provider}</strong><small>${status}</small></div>

}
function onboardPage() {
  const setup = state.onboarding;
  const complete = setup.index>=QUESTIONS.length;
  const messages = setup.messages.map(m=>chatTurn(m.role,m.role==='agent'?m.text.replace(' LinkedIn is in demo mode while publishing access is pending.',''):m.text)).join('');
  const thread = messages+(complete?connectionRows():'');
  const footer = complete
    ? '<div class="onboard-actions"><button class="btn primary" data-action="finish-onboard">Save brand &amp; open posts →</button></div>'
    : chatComposer('onboard-form','Reply to Lens')+'<div class="onboard-actions"><button class="btn ghost" type="button" data-action="skip-onboard">Skip to posts →</button></div>';

function postCard(post) {

  <header class="post-meta"><span class="linkedin-mark" role="img" aria-label="LinkedIn draft">${icon('linkedin')}</span><button class="icon ghost round" data-action="edit" aria-label="Edit post" title="Edit post">${icon('edit')}</button></header>
  <div class="post-body">${editing?`<form class="settings-grid" id="edit-form"><label class="form-label">Headline<input class="field" name="title" maxlength="180" value="${esc(post.title)}" required></label><label class="form-label">Post copy<textarea class="field" name="copy" rows="4" maxlength="3000" required>${esc(post.copy)}</textarea></label><div class="tools"><button class="btn primary" type="submit">Save edit</button><button class="btn ghost" data-action="cancel-edit" type="button">Cancel</button></div></form>`:
  `<h2>${esc(post.title)}</h2><div class="post-copy">${esc(post.copy)}</div>${post.visual?`<div class="post-visual"><strong>${esc(state.brand.name)}</strong><div class="visual-orb" aria-hidden="true"></div></div>`:''}${post.source?`<a href="${SOURCE}" target="_blank" rel="noopener">Creator Economy Hack · Event source ↗</a>`:''}`}</div>
  ${editing?'':`<div class="post-revision">${revising?revisionComposer('revise-form',post.id):`<button class="icon ghost round" data-action="revise" title="Suggest a revision" aria-label="Suggest a revision">${icon('chat')}</button>`}</div>`}

function reviewPage() {

  if (!post) return `<section class="empty-review"><div class="empty-content">

const DEMO_POSTS = [
  {id:'launch',title:'Introducing Lens',metrics:[1461,98,54,26]},
  {id:'feedback',title:'What we heard from founders',metrics:[949,66,29,16]}
];
const METRIC_LABELS = ['Post views','Likes','Link clicks','Followers gained'];
function insightPage() {
  const selection = analyticsPost === 'all' ? DEMO_POSTS : DEMO_POSTS.filter(post=>post.id===analyticsPost);
  const scale = {7:1,14:1.7,30:2.8}[analyticsRange];
  const bars = [9,18,15,26,33,29,40];
  const metrics = METRIC_LABELS.map((name,i)=>{
    const count = Math.round(selection.reduce((total,post)=>total+post.metrics[i],0)*scale);
    return `<div class="metric"><span>${name}</span><strong>${count.toLocaleString('en-US')}</strong><div class="bars" aria-hidden="true">${bars.map((_,j)=>`<i style="height:${count ? Math.round(bars[(j+i+(analyticsRange===7?0:1))%7] * (selection.length===1?.8:1)) : 0}px"></i>`).join('')}</div></div>`;
  }).join('');
  const postOptions = [...DEMO_POSTS, ...state.journal.filter(item=>item.status==='Scheduled').map(post=>({...post,id:'scheduled-'+post.id,title:post.title+' (scheduled)'}))];
  const allOptions = [{id:'all',title:'All sample posts'},...postOptions];
  const selected = allOptions.find(post=>post.id===analyticsPost) || allOptions[0];
  return `<section class="page">${heading('Analytics','LinkedIn · Sample metrics',false)}

    <div class="popup filter-popup" id="filters-dialog" popover="auto" role="dialog" aria-labelledby="filters-title"><div class="popup-head"><h2 id="filters-title">Filters</h2><button class="icon ghost" popovertarget="filters-dialog" popovertargetaction="hide" aria-label="Close filters">${icon('decline')}</button></div>
      <form id="filters-form" class="popup-form">
        <div><p id="posts-label"><strong>Post</strong></p><div class="post-options" role="radiogroup" aria-labelledby="posts-label">

        <label class="form-label">Date range<select name="range" class="field">${[7,14,30].map(days=>`<option value="${days}" ${analyticsRange===days?'selected':''}>Last ${days} days</option>`).join('')}</select></label>
        <div class="popup-actions"><button class="btn primary" type="submit">Apply filters</button></div>
      </form></div>
    ${selection.length?`<div class="analytics-grid">${metrics}</div>`:'<p class="muted">Insights will appear after this post is published.</p>'}</section>`;
}
const DAY_MS = 86400000;
const nyDate = new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
const nyTime = new Intl.DateTimeFormat('en-GB',{timeZone:'America/New_York',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});
const dayLabel = new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'});
function dateKey(slot) {
  const parts = Object.fromEntries(nyDate.formatToParts(slot).map(({type,value})=>[type,value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}
function moveDay(day,amount) {return new Date(Date.parse(day+'T00:00:00Z')+amount*DAY_MS).toISOString().slice(0,10);}
function dayOfWeek(day) {return new Date(day+'T00:00:00Z').getUTCDay();}
function firstDay(day) {return moveDay(day,-dayOfWeek(day));}
function easternSlot(day,time) {
  if(!/^\d{4}-\d{2}-\d{2}$/.test(day)||!/^\d{2}:\d{2}$/.test(time)) return null;
  const utc = Date.parse(day+'T'+time+':00Z');
  if(!Number.isFinite(utc)) return null;
  for(const offset of [4,5]) {
    const candidate = utc+offset*3600000;
    if(dateKey(candidate)===day && nyTime.format(candidate)===time) return candidate;
  }
  return null;
}
function scheduledPosts() {return state.journal.filter(post=>post.status==='Scheduled').sort((a,b)=>a.slot-b.slot);}
function recommendedSlot(day,ignoredId,earliest=Date.now()+1) {
  const workday = ![0,6].includes(dayOfWeek(day));
  const times = workday?['10:00','11:00','12:00','14:00','16:00','18:00','20:00']:['11:00','12:00','14:00','16:00','18:00','20:00'];
  const booked = new Set(scheduledPosts().filter(post=>post.id!==ignoredId).map(post=>post.slot));
  return times.map(time=>easternSlot(day,time)).find(slot=>slot!==null && slot>=earliest && !booked.has(slot)) ?? null;
}

function initializeCalendar() {
  if(calendarWeek) return;
  const now = Date.now();
  const upcoming = scheduledPosts().find(post=>post.slot>now);
  calendarWeek = firstDay(dateKey(upcoming?.slot || now));
}
function calendarPost(post) {
  return `<button class="calendar-item" draggable="true" data-post-id="${post.id}" data-action="select-post" title="${esc(post.title)}">
    <strong>${esc(post.title)}</strong></button>`;
}
function calendarPage() {
  initializeCalendar();
  const all = scheduledPosts();

function parseCadence(text) {
  if (/\b(once|twice) (daily|a day)\b/i.test(text)) return /twice/i.test(text) ? 14 : 7;
  if (/\b(daily|every day|a day|per day|month(?:ly)?)\b/i.test(text)) {
    const daily = /^(?:once )?(?:daily|every day)$/.test(text.toLowerCase());
    return daily ? 7 : null;
  }
  if (/\bevery (?:other|second) day\b/i.test(text)) return 3;
  if (/\btwice\b/i.test(text)) return 2;
  const match = text.toLowerCase().match(/\b(\d+|one|two|three|four|five|six|seven)\b/);
  const numbers = {one:1,two:2,three:3,four:4,five:5,six:6,seven:7};
  const number = match ? numbers[match[1]] ?? Number(match[1]) : /\b(weekly|once a week)\b/i.test(text) ? 1 : null;
  return Number.isInteger(number) && number>=1 && number<=14 ? number : null;
}

function reviseCopy(copy,request) {
  const replace = request.match(/^replace\s+["“](.+?)["”]\s+with\s+["“](.+?)["”][.!]?$/i);
  if(replace) {
    if(!copy.includes(replace[1])) return {message:'That phrase wasn’t in the draft. Try copying the exact words to replace.'};
    return {copy:copy.replace(replace[1],()=>replace[2]),message:'Replaced the phrase.'};
  }
  const add = request.match(/^(?:add|include|end with)\s+(.+)$/i);
  if(add) {
    const phrase = add[1].replace(/^["“](.*?)["”][.!]?$/,'$1');
    return {copy:copy+'\n\n'+phrase,message:'Added your line to the draft.'};
  }
  const remove = request.match(/^remove\s+["“](.+?)["”][.!]?$/i);
  if(remove) {
    if(!copy.includes(remove[1])) return {message:'That phrase wasn’t in the draft.'};
    return {copy:copy.replace(remove[1],'').replace(/ {2,}/g,' ').trim(),message:'Removed the phrase.'};
  }
  if(/shorter|shorten|concise|trim|tighten/i.test(request)) {
    const paragraphs = copy.split(/\n\s*\n/).filter(Boolean);
    const proposed = paragraphs.length>1
      ? paragraphs.slice(0,-1).join('\n\n')
      : copy.split(/(?<=[.!?])\s+/).slice(0,-1).join(' ');
    const shortened = proposed || copy.split(/\s+/).slice(0,Math.ceil(copy.split(/\s+/).length*.72)).join(' ').replace(/[,;:]$/,'')+'.';
    if(shortened.length>=copy.length) return {message:'This draft is already short. Try replacing a phrase.'};
    return {copy:shortened,message:'Shortened the draft.'};
  }
  const tone = /friendl|casual|conversational|warmer/i.test(request) ? 'A quick update from our team.' :
    /professional|formal/i.test(request) ? 'An update for our community.' : '';
  if(tone) return {copy:tone+'\n\n'+copy.replace(/^(A quick update from our team\.|An update for our community\.)\s*/,''),message:'Updated the opening line.'};
  return {message:'Try “make it shorter”, replace "old phrase" with "new phrase", or add a specific line.'};
}

  if(action==='finish-onboard') finishOnboard();
  if(action==='skip-onboard') finishOnboard(true);
  if(action==='edit' && !editing && !decisionPending) {editing=true;render();main.querySelector('input[name="title"]')?.focus();}
  if(action==='cancel-edit') {editing=false;render();}
  if(action==='approve'||action==='decline') decide(action==='approve');
  if(action==='queue-proposal') queueProposal();

  if(action==='select-post') {
    const id = Number(button.dataset.postId);
    if(getScheduledPost(id)) {selectedPostId=id;go('scheduled-post');}
  }
  if(action==='calendar-today') {calendarWeek=firstDay(dateKey(Date.now()));render();}
  if(action==='previous-week'||action==='next-week') {
    calendarWeek=moveDay(calendarWeek,action==='previous-week'?-7:7);
    render();
    main.querySelector('[data-action='+action+']')?.focus();
  }
  if(action==='revise' && !decisionPending) {
    revising=true;revisionError='';render();
    main.querySelector('#revise-form input[name=message]')?.focus();
  }
  if(action==='filters') positionFilters(button);
  if(action==='request-erase') main.querySelector('#erase-dialog')?.showModal();
  if(action==='cancel-erase') main.querySelector('#erase-dialog')?.close();
  if(action==='confirm-erase' && main.querySelector('#erase-dialog')?.open) eraseLocalData();
  if(action==='upload') main.querySelector('#brand-upload')?.click();
  if(action==='generate') generateMore();
  if(action==='download') downloadBrand();
  if(action==='download-logo') downloadLogo();
});
document.addEventListener('change',event=>{
  if(event.target.id==='brand-upload') {
    const file = event.target.files[0];
    event.target.value = '';
    importBrand(file);
  }
});
function clearDropTargets() {
  for(const target of main.querySelectorAll('.drop-target')) target.classList.remove('drop-target');
}
main.addEventListener('dragstart',event=>{
  const item = event.target.closest('[data-post-id]');
  if(view!=='calendar'||!item||!event.dataTransfer) return;
  scheduleDragId = Number(item.dataset.postId);
  event.dataTransfer.effectAllowed = 'move';
  event.dataTransfer.setData('text/plain',String(scheduleDragId));
});
main.addEventListener('dragover',event=>{
  const target = event.target.closest('[data-drop-day]');
  if(!target||scheduleDragId===null) return;
  event.preventDefault();
  clearDropTargets();
  target.classList.add('drop-target');
  if(event.dataTransfer) event.dataTransfer.dropEffect='move';
});
main.addEventListener('dragleave',event=>{
  const target = event.target.closest('[data-drop-day]');
  if(target && !target.contains(event.relatedTarget)) target.classList.remove('drop-target');
});
main.addEventListener('drop',event=>{
  const target = event.target.closest('[data-drop-day]');
  if(!target||scheduleDragId===null) return;
  event.preventDefault();
  const id = scheduleDragId;
  scheduleDragId = null;
  clearDropTargets();
  reschedulePost(id,target.dataset.dropDay);
});
main.addEventListener('dragend',()=>{scheduleDragId=null;clearDropTargets();});
function paintSwipe(card,delta) {
  const strength = Math.min(0.65,Math.abs(delta)/180);
  const color = delta<0?'#ffab9e':'#bdf4c6';
  card.style.setProperty('--offset',delta+'px');
  card.style.setProperty('--tilt',(delta/19)+'deg');
  card.style.setProperty('--strength',strength);
  card.style.setProperty('--tint',color);
  card.querySelector('#swipe-mark').innerHTML = icon(delta<0?'decline':'approve');
  for(const [id,direction] of [['decline',-1],['approve',1]]) {
    const button = document.querySelector('#'+id);
    const active = delta*direction>20;
    button.classList.toggle('lit',active);
    button.style.backgroundColor = active?`color-mix(in srgb, ${color} ${Math.round(strength*130)}%, var(--surface))`:'';
    if(active) button.style.color = strength>.43?'#15181a':color;
    else button.style.color = '';
  }
}
main.addEventListener('pointerdown',event=>{
  const card = event.target.closest('#post-card');
  if(!card||editing||decisionPending||event.button!==0||event.target.closest('button,a,input,textarea,.post-revision')) return;
  drag = {card,id:event.pointerId,x:event.clientX,delta:0};
  card.setPointerCapture(event.pointerId);
  card.classList.add('dragging');
});
main.addEventListener('pointermove',event=>{
  if(!drag||drag.id!==event.pointerId) return;
  drag.delta = event.clientX-drag.x;
  paintSwipe(drag.card,drag.delta);
});
function endSwipe(event,commit) {
  if(!drag||drag.id!==event.pointerId) return;
  const {card,delta} = drag;
  drag = null;
  card.classList.remove('dragging');
  if(commit && Math.abs(delta)>=Math.min(97,card.offsetWidth*.22)) decide(delta>0,card);
  else paintSwipe(card,0);
}
main.addEventListener('pointerup',event=>endSwipe(event,true));
main.addEventListener('pointercancel',event=>endSwipe(event,false));
main.addEventListener('lostpointercapture',event=>endSwipe(event,false));
document.addEventListener('keydown',event=>{
  if(event.key==='Escape' && (main.querySelector('dialog[open]') || main.querySelector('#filters-dialog:popover-open'))) return;
  if(event.key==='Enter' && event.target.matches?.('.chat-composer textarea') && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    event.target.form.requestSubmit();
  }
  if(event.key==='Escape' && view==='scheduled-post') go('calendar');
  else if(event.key==='Escape' && editing) {editing=false;render();}
  else if(event.key==='Escape' && revising) {revising=false;revisionError='';render();main.querySelector('[data-action=revise]')?.focus();}
  else if(event.key==='Escape' && ['analytics','calendar','chat','settings'].includes(view)) go('review');
});
render();
</script>
</body>
